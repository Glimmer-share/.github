<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#2a1738"/>
      <stop offset="1" stop-color="#5b2a5e"/>
    </linearGradient>
    <style>
      .t{font:700 56px 'Segoe UI',Arial,sans-serif;fill:#fff;letter-spacing:4px}
      .s{font:16px 'Segoe UI',Arial,sans-serif;fill:#f0a8d8;letter-spacing:2px}
      .star{fill:#fff;animation:tw 3s ease-in-out infinite}
      .d1{animation-delay:.5s}.d2{animation-delay:1.2s}.d3{animation-delay:2s}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    </style>
  </defs>
  <rect width="800" height="200" fill="url(#bg)"/>
  <circle class="star" cx="120" cy="50" r="2"/>
  <circle class="star d1" cx="260" cy="150" r="1.5"/>
  <circle class="star d2" cx="540" cy="40" r="2"/>
  <circle class="star d3" cx="680" cy="140" r="1.5"/>
  <circle class="star d1" cx="400" cy="30" r="1.2"/>
  <circle class="star d2" cx="90" cy="160" r="1.2"/>
  <circle class="star d3" cx="730" cy="70" r="2"/>
  <text class="t" x="400" y="105" text-anchor="middle">GLIMMER</text>
  <text class="s" x="400" y="145" text-anchor="middle">LITTLE SPARKS OF IDEAS</text>
</svg>
