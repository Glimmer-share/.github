<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="0.55" stop-color="#1f1233"/>
      <stop offset="1" stop-color="#4a2150"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e879b9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e879b9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd3ee"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="900" height="260" rx="18"/></clipPath>
    <style>
      .title{font:700 64px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:10px;fill:url(#tg)}
      .sub{font:600 13px 'Segoe UI',Arial,sans-serif;letter-spacing:6px;fill:#f0a8d8}
      .tag{font:400 15px 'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;letter-spacing:3px;fill:#c9b6e4;animation:fade 1.8s ease-out both;animation-delay:.6s}
      .star{fill:#fff;animation:tw 3.5s ease-in-out infinite}
      .d1{animation-delay:.6s}.d2{animation-delay:1.4s}.d3{animation-delay:2.2s}
      .spark{fill:#fff;transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}
      .shoot{animation:shoot 8s ease-in infinite}
      .breath{animation:breath 6s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
      @keyframes pulse{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.15);opacity:1}}
      @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
      @keyframes breath{0%,100%{opacity:.7}50%{opacity:1}}
      @keyframes shoot{0%{transform:translateX(0);opacity:0}4%{opacity:1}22%{transform:translateX(300px);opacity:0}100%{transform:translateX(300px);opacity:0}}
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <ellipse class="breath" cx="760" cy="230" rx="320" ry="150" fill="url(#glowPink)"/>
    <ellipse class="breath" cx="110" cy="40" rx="260" ry="130" fill="url(#glowPurple)"/>

    <circle class="star" cx="70" cy="60" r="1.6"/>
    <circle class="star d1" cx="150" cy="190" r="1.2"/>
    <circle class="star d2" cx="230" cy="40" r="1.8"/>
    <circle class="star d3" cx="310" cy="215" r="1.2"/>
    <circle class="star d1" cx="380" cy="28" r="1.2"/>
    <circle class="star d2" cx="520" cy="228" r="1.5"/>
    <circle class="star d3" cx="590" cy="35" r="1.8"/>
    <circle class="star" cx="680" cy="190" r="1.2"/>
    <circle class="star d1" cx="760" cy="60" r="1.6"/>
    <circle class="star d2" cx="835" cy="150" r="1.4"/>
    <circle class="star d3" cx="860" cy="40" r="1.2"/>
    <circle class="star" cx="45" cy="165" r="1.3"/>

    <g transform="translate(560,18) rotate(28)">
      <rect class="shoot" x="-110" y="-1" width="110" height="2" rx="1" fill="url(#trail)"/>
    </g>

    <path class="spark" filter="url(#glow)" transform="translate(690,78)"
      d="M0,-16 C1.5,-5 5,-1.5 16,0 C5,1.5 1.5,5 0,16 C-1.5,5 -5,1.5 -16,0 C-5,-1.5 -1.5,-5 0,-16Z"/>
    <path class="spark d2" transform="translate(205,170) scale(.55)"
      d="M0,-16 C1.5,-5 5,-1.5 16,0 C5,1.5 1.5,5 0,16 C-1.5,5 -5,1.5 -16,0 C-5,-1.5 -1.5,-5 0,-16Z"/>

    <text class="title" x="450" y="130" text-anchor="middle" filter="url(#glow)">GLIMMER</text>
    <text class="sub" x="450" y="165" text-anchor="middle">LITTLE SPARKS OF IDEAS</text>
    <rect x="420" y="182" width="60" height="1.5" rx="1" fill="#e879b9" opacity="0.7"/>
    <text class="tag" x="450" y="212" text-anchor="middle">一点点灵感的微光,慢慢分享</text>
  </g>
</svg>
